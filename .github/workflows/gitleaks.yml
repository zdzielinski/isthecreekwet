# Fails when a pull request's commits contain a secret, like an API key or a committed .dev.vars.
# Gitleaks scans every commit in the pull request, so a secret added and then removed still fails.
name: Gitleaks

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
