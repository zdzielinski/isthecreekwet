# The checks from CLAUDE.md: formatting, clippy (for the wasm32 build that Cloudflare runs), tests,
# docs and a dependency audit. Each runs as its own job, in parallel.
name: Rust Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every check, even when another fails
      matrix:
        include:
          - name: Cargo Format
            run: cargo fmt --check
          - name: Cargo Clippy
            run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
          - name: Cargo Test
            run: cargo test
          - name: Cargo Docs
            run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          # Fails on known vulnerabilities in Cargo.lock. Advisories that are only warnings, like
          # chrono being unmaintained (it comes in through `worker`), are reported but don't fail.
          - name: Cargo Audit
            run: cargo audit
            tool: cargo-audit
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain, components and wasm32 target pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      # One build cache per check, since each compiles differently.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # A prebuilt binary for checks that need an extra tool, so it isn't compiled on every run.
      - if: matrix.tool
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.tool }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # The one check for branch rules to require: it passes only when every check above passed, so
  # checks can be added or renamed without changing the rules.
  rust-checks:
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: All Rust checks passed
        run: test "${{ needs.rust.result }}" = success
