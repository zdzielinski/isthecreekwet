[package]
name = "isthecreekwet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9" }
worker-macros = { version = "0.9" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[profile.release]
lto = true
codegen-units = 1
